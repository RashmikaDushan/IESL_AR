<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    style="
      font-family: 'Poppins', system-ui;
      font-weight: 400;
      font-style: normal;
      color: rgb(255, 255, 255);
    "
  >
    <div id="scanning-overlay" class="hidden" style="text-align: center">
      <div style="height: 40vh"></div>
      <h3 style="padding: 10vw; text-shadow: 0 0 15px #000000">
        Point the camera at entrance arch staying 3 meters away from the
        entrance arch.
      </h3>
      <div style="height: 15vh"></div>
      <h5 style="font-weight: 500">Copyright © 2024 University of Moratuwa</h5>
    </div>
    <div id="loading-overlay" class="hidden" style="text-align: center">
      <div style="height: 20vh"></div>
      <h3 style="padding: 10vw; color: #000000; font-weight: 600">
        Proudly presented by University of Moratuwa
      </h3>
    </div>
    <div id="error-overlay" class="hidden" style="text-align: center">
      <div style="height: 20vh"></div>
      <h3 style="padding: 10vw; color: #000000; font-weight: 600">
        Something went wrong. Please contact UOM stall.
      </h3>
    </div>
    <div id="orientation-warning" class="hidden">
      <h3
        style="padding: 10vw; color: #000000; font-weight: 600; font-size: 20px"
      >
        Please rotate your device to portrait mode to use the AR experience.
      </h3>
    </div>
    <a
      style="position: absolute; top: 20px; left: 20px; z-index: 100"
      href="https://techno-stall-uom.vercel.app/ar"
      ><button
        style="
          border-radius: 1rem;
          color: #242836;
          border: 0px;
          height: 3rem;
          width: 8rem;
          font-weight: 500;
          font-size: 1rem;
        "
      >
        Go Back
      </button></a
    >
    <!-- <div id="bottom-card" class="bottom-card bottom-card-show">
      <div id="ui-text" style="color: #242836">Loading...</div>
    </div> -->
    <a-scene
      id="ar-scene"
      mindar-image="filterMinCF:0.00001; filterBeta: 0.01;warmupTolerance: 60;missTolerance: 20;uiError:#error-overlay; uiLoading:#loading-overlay; uiScanning:#scanning-overlay;
    imageTargetSrc: targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights; toneMapping:ACESFilmic; exposure:0.5; antialias:true"
      vr-mode-ui="enabled: true;"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- <a-asset-item
          id="avatarModel"
          src="quantum_computer.glb"
        ></a-asset-item> -->
        <img id="reflectionMap" src="Reflection.jpg" />
      </a-assets>
      <script>
        AFRAME.registerComponent("reflection-texture", {
          init: function () {
            var scene = this.el.sceneEl.object3D;
            var renderer = this.el.sceneEl.renderer;

            // Load the texture for reflection
            var textureLoader = new THREE.TextureLoader();
            textureLoader.load(
              document.querySelector("#reflectionMap").src,
              (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;

                // Apply texture to environment and models for reflection
                scene.environment = texture; // Use it as the reflection environment
              }
            );
          },
        });

        // Attach the reflection-texture component to the scene
        document
          .querySelector("a-scene")
          .setAttribute("reflection-texture", "");

        function handleOrientation() {
          const orientationWarning = document.getElementById(
            "orientation-warning"
          );
          const arScene = document.getElementById("ar-scene");

          if (window.orientation === 90 || window.orientation === -90) {
            orientationWarning.classList.remove("hidden");
            arScene.pause();
          } else {
            orientationWarning.classList.add("hidden");
            arScene.play();
          }
        }

        handleOrientation();

        window.addEventListener("orientationchange", handleOrientation);
      </script>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" id="target1">
        <!-- <a-entity position="0 0 0" animation="property: position; to: 0 0 -0.1; dur: 2000; easing: easeInOutQuad;">
        <a-entity position="0.9 0.3 0"text="align:center;https://cdn.aframe.io/fonts/Aileron-Semibold.fnt;value: Quantum Computer; width:2;color:#6A88E4"></a-entity>
        <a-image position="0.9 -0.2 0" src="card.png" opacity="0.98" height="1.464" width="1.024"></a-image>
        <a-entity position="0.9 -0.2 0" text="align:center;wrapCount:30;https://cdn.aframe.io/fonts/Aileron-Semibold.fnt;value: A quantum computer uses qubits that can be both 0 and 1 at the same time, unlike normal bits. This lets it solve complex problems faster. Another feature, entanglement, links qubits to work together, making it powerful for tasks like cryptography and simulations.; width:0.85;color: #4A536F;"></a-entity>
      </a-entity> -->
        <!-- <a-gltf-model rotation="0 0 0 " position="0.3 0 0.5" scale="0.5 0.5 0.5" src="#avatarModel"
          animation="property: rotation; to: 0 360 0; dur: 7500; easing: linear; loop: true;"> -->
        <a-entity
          id="model-container"
          rotation="0 0 0"
          position="0.3 0 0."
          scale="0.5 0.5 0.5"
          animation="property: rotation; to: 0 360 0; dur: 7500; easing: linear; loop: true;"
        ></a-entity>
      </a-entity>
    </a-scene>
    <script src="index.js"></script>
  </body>
</html>
